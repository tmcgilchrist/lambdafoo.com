name: OCaml
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ocaml-compiler: ["5.4.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
      - name: Install Dependencies
        run: opam install . --deps-only --yes
      - name: Build Generator
        run: opam exec -- dune build
      - name: Build Site
        # Runs from the repository root, which matters: the generator reads
        # posts/, pages/, templates/, css/, images/, talks/ and main/grammars/
        # relative to the working directory, and writes _site/.
        # The `--` keeps `build` as the generator's argument, not dune's.
        run: opam exec -- dune exec main/site.exe -- build
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: _site # The folder the action should deploy.
          clean: true # Automatically remove deleted files from the deploy branch
