<p>Drafts in <code>drafts/</code>, rendered for preview only. Run
<code>dune exec main/site.exe -- check-drafts</code> to see which are ready to publish.</p>
<ul>
    {%- for post in posts %}
        <li>
            <a href="{{ post.url }}">{{ post.title }}</a>{% if post.has_date %} - {{ post.pretty_date }}{% else %} - <em>undated</em>{% endif %}
        </li>
    {%- endfor %}
</ul>
